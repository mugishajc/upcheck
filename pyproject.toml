[project]
name = "flask-url-monitor"
version = "0.1.0"
description = "Small uptime monitor: periodic URL checks, latency history, uptime stats, dashboard and JSON API."
requires-python = ">=3.11"
license = { text = "MIT" }

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
